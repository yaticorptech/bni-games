<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c16">
  <title>Award Night Games</title>
  <link rel="icon" type="image/png" href="/img/brand/mark.png">
  <link rel="apple-touch-icon" href="/img/brand/icon-512.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="brandbar"><img class="bb-bni" src="/img/brand/bni-inspire.png" alt="BNI Inspire"><img class="bb-yc" src="/img/brand/yaticorp-white.png" alt="Yaticorp"></header>
  <main id="app">
    <section id="view-boot" class="view boot"><div class="spinner"></div><p id="boot-msg">Loading games…</p></section>
    <section id="view-join" class="view hidden"></section>
    <section id="view-hub" class="view hidden"></section>
    <section id="view-game" class="view view-game hidden"></section>
    <section id="view-result" class="view hidden"></section>
    <section id="view-tap" class="view view-game hidden"></section>
    <section id="view-quiz" class="view view-game hidden"></section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
